name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

# Un nouveau push annule le build précédent encore en cours.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Image avec Godot, les templates d'export, le JDK 17 et le SDK Android.
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparation de Godot (templates d'export + réglages Android)
        run: |
          set -e
          mkdir -p ~/.config/godot ~/.local/share/godot/export_templates

          # Dans un job « container », $HOME n'est pas /root : on y recopie les templates.
          TPL="${GODOT_VERSION}.stable"
          if [ "$HOME" != "/root" ] && [ ! -d "$HOME/.local/share/godot/export_templates/$TPL" ]; then
            cp -r "/root/.local/share/godot/export_templates/$TPL" "$HOME/.local/share/godot/export_templates/$TPL"
          fi
          ls "$HOME/.local/share/godot/export_templates/$TPL" | head -5

          # Réglages de l'éditeur (SDK Android, JDK) écrits ici : on ne dépend pas de l'image.
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          MINOR="${GODOT_VERSION%.*}"
          cat > "$HOME/.config/godot/editor_settings-${MINOR}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_DIR}"
          export/android/android_sdk_path = "${ANDROID_DIR}"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          cat "$HOME/.config/godot/editor_settings-${MINOR}.tres"
          godot --version

      - name: Composants du SDK Android (build-tools récents, non bloquant)
        continue-on-error: true
        run: |
          ANDROID_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          SDKM="$(command -v sdkmanager || echo "$ANDROID_DIR/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --sdk_root="$ANDROID_DIR" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_DIR" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Import des ressources
        run: godot --headless --path . --import || true

      - name: Tests logiques (évaluateur, blackjack, poker)
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Test de fumée de l'interface
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Clé de signature (secrets si valides, sinon clé temporaire)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -u
          KS_FILE="$RUNNER_TEMP/aszimut-release.keystore"
          MODE="temporaire"
          REASON="aucun secret de signature"

          if [ -n "${KS_B64}" ] && [ -n "${KS_ALIAS}" ] && [ -n "${KS_PASS}" ]; then
            # Les trois secrets existent : on vérifie qu'ils ouvrent bien la clé.
            if echo "${KS_B64}" | base64 -d > "$KS_FILE" 2>/dev/null \
               && keytool -list -keystore "$KS_FILE" -storepass "${KS_PASS}" -alias "${KS_ALIAS}" > /dev/null 2>&1; then
              MODE="secrets"
            else
              REASON="secrets présents mais inutilisables (base64, alias ou mot de passe incorrect)"
              echo "::warning::${REASON}. Une clé temporaire est utilisée à la place."
            fi
          elif [ -n "${KS_B64}${KS_ALIAS}${KS_PASS}" ]; then
            REASON="secrets incomplets (il faut les trois)"
            echo "::warning::${REASON}. Une clé temporaire est utilisée à la place."
          fi

          if [ "$MODE" = "secrets" ]; then
            ALIAS="${KS_ALIAS}"
            PASS="${KS_PASS}"
            echo "Signature avec la clé des secrets du dépôt."
          else
            rm -f "$KS_FILE"
            ALIAS="aszimut"
            PASS="aszimut-ci"
            keytool -genkeypair -v -keystore "$KS_FILE" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=AsZimut,O=WildZimut,C=FR" > /dev/null
            echo "::notice::Signature avec une clé temporaire (${REASON}). Chaque build a une signature différente : désinstaller l'ancienne version avant d'installer la nouvelle."
          fi

          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS_FILE"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
            echo "SIGN_MODE=$MODE"
          } >> "$GITHUB_ENV"

      - name: Version 0.0.01.PR.PUSH (dernière PR fusionnée + numéro de push)
        env:
          GH_TOKEN: ${{ github.token }}
          # Décalage réglable (Settings > Variables > Actions : PUSH_OFFSET / PR_OFFSET), 0 par défaut.
          PUSH_OFFSET: ${{ vars.PUSH_OFFSET }}
          PR_OFFSET: ${{ vars.PR_OFFSET }}
        run: |
          set -u
          BASE="$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2 | cut -d. -f1-3)"
          BASE="${BASE:-0.0.01}"
          PR=""
          RESP="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=repo:${GITHUB_REPOSITORY}+is:pr+is:merged&sort=created&order=desc&per_page=1" 2>/dev/null || true)"
          if [ -n "$RESP" ]; then PR="$(echo "$RESP" | jq -r '.items[0].number // empty' 2>/dev/null || true)"; fi
          if [ -z "$PR" ]; then echo "::warning::Dernière PR fusionnée introuvable : 0 utilisé."; PR=0; fi
          PR=$((PR + ${PR_OFFSET:-0}))
          PUSH=$((GITHUB_RUN_NUMBER + ${PUSH_OFFSET:-0}))
          FULL="$(printf '%s.%03d.%03d' "$BASE" "$PR" "$PUSH")"
          sed -i "s|^config/version=.*|config/version=\"${FULL}\"|" project.godot
          grep '^config/version=' project.godot

      - name: Numéro de version
        run: |
          set -eu
          VERSION="$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)"
          VERSION="${VERSION:-0.0.0}"
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${VERSION}\"|" export_presets.cfg
          grep -E '^version/(code|name)=' export_presets.cfg
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Export de l'APK (release)
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/aszimut.apk
          ls -l build/

      - name: Résumé
        run: |
          {
            echo "### AsZimut ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})"
            if [ "${SIGN_MODE}" = "secrets" ]; then
              echo "- Signature : **clé des secrets du dépôt** (mises à jour installables par-dessus)."
            else
              echo "- Signature : **clé temporaire** — désinstaller l'ancienne version avant d'installer celle-ci."
            fi
            echo "- Artefact : \`aszimut-release-apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: aszimut-release-apk
          path: build/aszimut.apk
