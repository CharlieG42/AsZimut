name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    # Image avec Godot, les templates d'export, le JDK 17 et le SDK Android.
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparation de Godot (templates d'export + réglages Android)
        run: |
          set -e
          mkdir -p ~/.config/godot ~/.local/share/godot/export_templates

          # Dans un job « container », $HOME n'est pas /root : on y recopie les templates.
          TPL="${GODOT_VERSION}.stable"
          if [ "$HOME" != "/root" ] && [ ! -d "$HOME/.local/share/godot/export_templates/$TPL" ]; then
            cp -r "/root/.local/share/godot/export_templates/$TPL" "$HOME/.local/share/godot/export_templates/$TPL"
          fi
          ls "$HOME/.local/share/godot/export_templates/$TPL" | head -5

          # Réglages de l'éditeur (SDK Android, JDK) écrits ici : on ne dépend pas de l'image.
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          MINOR="${GODOT_VERSION%.*}"
          cat > "$HOME/.config/godot/editor_settings-${MINOR}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_DIR}"
          export/android/android_sdk_path = "${ANDROID_DIR}"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          cat "$HOME/.config/godot/editor_settings-${MINOR}.tres"
          godot --version

      - name: Composants du SDK Android (build-tools récents, non bloquant)
        continue-on-error: true
        run: |
          ANDROID_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          SDKM="$(command -v sdkmanager || echo "$ANDROID_DIR/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --sdk_root="$ANDROID_DIR" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_DIR" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Import des ressources
        run: godot --headless --path . --import || true

      - name: Tests logiques (évaluateur, blackjack, poker)
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Test de fumée de l'interface
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          KS_FILE="$RUNNER_TEMP/aszimut-release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "Clé de signature fournie par les secrets du dépôt."
            echo "$KS_B64" | base64 -d > "$KS_FILE"
            ALIAS="$KS_ALIAS"
            PASS="$KS_PASS"
          else
            echo "::warning::Aucune clé dans les secrets : une clé temporaire est générée. Chaque APK a une signature différente (désinstaller l'ancienne version avant d'installer la nouvelle). Voir le README pour fixer une clé."
            ALIAS="aszimut"
            PASS="aszimut-ci"
            keytool -genkeypair -v -keystore "$KS_FILE" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=AsZimut,O=WildZimut,C=FR" > /dev/null
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KS_FILE"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Export de l'APK (release)
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/aszimut.apk
          ls -l build/

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: aszimut-release-apk
          path: build/aszimut.apk
