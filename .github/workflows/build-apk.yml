name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mise en place du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Mise en place de Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Génération de la plateforme Android
        run: flutter create --platforms=android --org com.wildzimut --project-name aszimut .

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Analyse statique (non bloquant)
        run: flutter analyze
        continue-on-error: true

      - name: Compilation de l'APK (release)
        run: flutter build apk --release

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: aszimut-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publication des logs de build (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/app/outputs/logs/
            *.log
